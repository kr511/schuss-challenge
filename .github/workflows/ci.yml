name: CI

on:
  push:
  pull_request:

# Push + pull_request both fire for a PR branch; cancel the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Logic & integrity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  mobile:
    name: Mobile layout (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers for Playwright
        # iPhone device profiles use the WebKit (Safari) engine; Pixel uses
        # Chromium. Install both so iOS-specific behaviour is tested for real.
        run: npx playwright install --with-deps chromium webkit
      - name: Run mobile layout tests
        run: npm run test:mobile
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
